# ============================================================
#  Agent Flume "stream" : topic Kafka des réservations -> HDFS
#  Montre l'intégration Kafka + Flume : les événements temps réel
#  sont aussi archivés dans le Data Lake pour l'analyse batch.
#  Lancement :
#   flume-ng agent -n stream -c $FLUME_HOME/conf -f /opt/flume-conf/kafka-hdfs.conf -Dflume.root.logger=INFO,console
# ============================================================
stream.sources  = src_kafka
stream.channels = ch_mem
stream.sinks    = sink_hdfs

stream.sources.src_kafka.type                    = org.apache.flume.source.kafka.KafkaSource
stream.sources.src_kafka.kafka.bootstrap.servers = kafka:9092
stream.sources.src_kafka.kafka.topics            = hotel-bookings
stream.sources.src_kafka.kafka.consumer.group.id = flume-archiver
stream.sources.src_kafka.kafka.consumer.auto.offset.reset = earliest
stream.sources.src_kafka.batchSize               = 100
stream.sources.src_kafka.channels                = ch_mem

stream.channels.ch_mem.type                = memory
stream.channels.ch_mem.capacity            = 10000
stream.channels.ch_mem.transactionCapacity = 1000

stream.sinks.sink_hdfs.type              = hdfs
stream.sinks.sink_hdfs.channel           = ch_mem
stream.sinks.sink_hdfs.hdfs.path         = hdfs://namenode:9000/data/hotel/stream/dt=%Y-%m-%d
stream.sinks.sink_hdfs.hdfs.filePrefix   = bookings
stream.sinks.sink_hdfs.hdfs.fileSuffix   = .csv
stream.sinks.sink_hdfs.hdfs.fileType     = DataStream
stream.sinks.sink_hdfs.hdfs.writeFormat  = Text
stream.sinks.sink_hdfs.hdfs.useLocalTimeStamp = true
stream.sinks.sink_hdfs.hdfs.rollInterval = 20
stream.sinks.sink_hdfs.hdfs.rollSize     = 0
stream.sinks.sink_hdfs.hdfs.rollCount    = 0
