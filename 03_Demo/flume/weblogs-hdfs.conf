# ============================================================
#  Agent Flume "weblogs" : logs du moteur de réservation -> HDFS
#  Source  : spooldir (chaque nouveau fichier de log déposé est ingéré)
#  Channel : file (durable : pas de perte si l'agent redémarre)
#  Sink    : HDFS, partitionné par date
#  Lancement :
#   flume-ng agent -n weblogs -c $FLUME_HOME/conf -f /opt/flume-conf/weblogs-hdfs.conf -Dflume.root.logger=INFO,console
# ============================================================
weblogs.sources  = src_spool
weblogs.channels = ch_file
weblogs.sinks    = sink_hdfs

# ---- Source ----
weblogs.sources.src_spool.type     = spooldir
weblogs.sources.src_spool.spoolDir = /var/spool/weblogs
weblogs.sources.src_spool.fileHeader = true
weblogs.sources.src_spool.deletePolicy = never
# ignore les fichiers temporaires en cours d'écriture (.tmp_*)
weblogs.sources.src_spool.ignorePattern = ^\\..*$
weblogs.sources.src_spool.channels = ch_file
# Intercepteur : ajoute un timestamp pour le partitionnement HDFS
weblogs.sources.src_spool.interceptors = ts
weblogs.sources.src_spool.interceptors.ts.type = timestamp

# ---- Channel ----
weblogs.channels.ch_file.type          = file
weblogs.channels.ch_file.checkpointDir = /tmp/flume/weblogs/checkpoint
weblogs.channels.ch_file.dataDirs      = /tmp/flume/weblogs/data

# ---- Sink ----
weblogs.sinks.sink_hdfs.type                   = hdfs
weblogs.sinks.sink_hdfs.channel                = ch_file
weblogs.sinks.sink_hdfs.hdfs.path              = hdfs://namenode:9000/data/hotel/weblogs/dt=%Y-%m-%d
weblogs.sinks.sink_hdfs.hdfs.filePrefix        = access
weblogs.sinks.sink_hdfs.hdfs.fileSuffix        = .log
weblogs.sinks.sink_hdfs.hdfs.fileType          = DataStream
weblogs.sinks.sink_hdfs.hdfs.writeFormat       = Text
weblogs.sinks.sink_hdfs.hdfs.rollInterval      = 30
weblogs.sinks.sink_hdfs.hdfs.rollSize          = 10485760
weblogs.sinks.sink_hdfs.hdfs.rollCount         = 0
weblogs.sinks.sink_hdfs.hdfs.batchSize         = 1000
